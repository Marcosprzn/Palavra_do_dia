services:
  - type: web
    name: palavra-do-dia
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false # Preencha no painel do Render com a URL do Supabase PostgreSQL
      - key: SESSION_DATA_PATH
        value: ./sessions
      - key: DEFAULT_SCHEDULE_TIME
        value: "06:00"
    disk:
      name: session-data
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
