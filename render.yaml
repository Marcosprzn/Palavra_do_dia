services:
  - type: web
    name: palavra-do-dia
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false # Cole a connection string do Supabase PostgreSQL nas variáveis do Render
      - key: DEFAULT_SCHEDULE_TIME
        value: "06:00"
